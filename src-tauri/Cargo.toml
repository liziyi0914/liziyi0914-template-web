[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# rustls-tls：让 Tauri 移动端 HTTPS/dev 协议在缺 provider 时自己装 ring，
# 与我们的 rustls-no-provider 策略一致（该 feature 映射到 reqwest/rustls-no-provider）。
tauri = { version = "2.11.3", features = ["tray-icon", "rustls-tls"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-mic = { path = "plugins/mic" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
async-trait = "0.1"
uuid = { version = "1.20", features = ["v4"] }
base64 = "0.23"
thiserror = "2"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "charset", "http2", "rustls-no-provider"] }
async-openai = { version = "0.41", default-features = false, features = ["chat-completion", "rustls-no-provider"] }
teaching-platform = { path = "crates/teaching-platform" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
